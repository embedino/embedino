name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ./core

permissions:
  contents: read

jobs:
  check_and_build:
    name: Quality, Release Smoke & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
          working-directory: core

      - name: Check Formatting & Linting
        run: pnpm exec vp check

      - name: Strict Typecheck
        run: pnpm run tc

      - name: Verify Release Plumbing
        run: pnpm run release:smoke

      - name: Build Workspace Packages
        run: pnpm run build

      - name: Build Desktop Production Bundle
        run: pnpm run build:desktop

  unit_tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
          working-directory: core

      - name: Run Test Suite
        run: pnpm run test
